<?xml version="1.0" encoding="UTF-8"?>
<!-- COPIA ESPEJO de frontend/assets/duelo/girar.svg — si cambia allá, cambia acá.
     Botón GIRAR de la Partida Kodi. Geometría exacta, centro en (12.5, 15.5).
     · Aro de grosor constante 0.35: el ápice interior sale de desplazar las dos
       aristas, no de repetir el ángulo, que dejaba el aro más fino en las bases.
     · Ápice rematado con un arco de 0.4 en vez de punta viva.
     · Filetes de 0.6 donde las aristas entran al círculo, para que la silueta
       se lea como un cuerpo continuo y no como un triángulo pegado a un disco.
     · Rótulo centrado en el eje del círculo (venía 0.035 arriba).
     · viewBox con 1.5 de margen: la sombra vive dentro del archivo y sigue la
       silueta, punta incluida. -->
<svg xmlns="http://www.w3.org/2000/svg" width="25" height="28" viewBox="0 0 25 28">
